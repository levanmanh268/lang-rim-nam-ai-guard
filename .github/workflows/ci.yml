name: Production Build and API Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build Next.js production
        run: npm run build
      - name: Run real HTTP smoke tests
        run: node scripts/smoke.mjs
